<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iara Gonçalves · portfólio UGC</title>
<meta name="description" content="Iara Gonçalves, UGC creator e influencer em Brasília: vídeos com vida real e storytelling para marcas de saúde, beleza, moda e lifestyle.">
<meta name="theme-color" content="#1b2b22">

<!-- Prévia do link no WhatsApp (endereço do site publicado no GitHub Pages) -->
<meta property="og:title" content="Iara Gonçalves · portfólio UGC">
<meta property="og:description" content="Fisioterapeuta e criadora de conteúdo. Storytelling com vida real para marcas de saúde, beleza, moda e lifestyle.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://iaragoncalves00.github.io/-ugc/">
<meta property="og:image" content="https://iaragoncalves00.github.io/-ugc/midia/galeria/capa.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&display=swap" rel="stylesheet">

<style>
/* Paleta: verde #1b2b22 · oliva #8f7a2a · creme #e9e5da · amarelo #e8c94a (e tons claros delas) */
:root{
  --verde:#1b2b22; --oliva:#8f7a2a; --creme:#e9e5da; --amarelo:#e8c94a;
  --papel:#f5f2ea; --amarelo-claro:#f3e3a0; --salvia:#cfd6c8; --linha:#d6d0bd;
  --serifa:"Fraunces", Georgia, serif; --texto:"DM Sans", system-ui, sans-serif; --mao:"Caveat", cursive;
  --sombra:rgba(27,43,34,.18);
}
*{box-sizing:border-box}
html{overflow-x:clip}
@media (prefers-reduced-motion:no-preference){ html{scroll-behavior:smooth} }
body{margin:0;background:var(--creme);color:var(--verde);font-family:var(--texto);font-size:16px;line-height:1.55;overflow-x:clip}
img,video{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3{font-family:var(--serifa);font-weight:500;margin:0;line-height:1.1}
h2{font-size:clamp(28px,4vw,44px)}
h3{font-size:clamp(22px,2.6vw,30px)}
p{margin:0}
:focus-visible{outline:3px solid var(--oliva);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding:0 28px}
section{scroll-margin-top:84px}
.mao{font-family:var(--mao);font-weight:700}
.etiqueta{display:inline-block;background:var(--amarelo-claro);color:var(--verde);border:1.5px solid var(--verde);border-radius:999px;padding:5px 13px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px}
.centro{text-align:center}
.sub{margin-top:12px;max-width:56ch;font-size:16px}
.centro .sub{margin-left:auto;margin-right:auto}
.quadriculado{background-color:var(--papel);background-image:linear-gradient(var(--linha) 1px,transparent 1px),linear-gradient(90deg,var(--linha) 1px,transparent 1px);background-size:26px 26px}

/* ---------- botões ---------- */
.botoes{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:999px;border:2px solid var(--verde);font-family:var(--texto);font-size:15px;font-weight:700;text-decoration:none;cursor:pointer;box-shadow:3px 3px 0 var(--verde);transition:transform .15s, box-shadow .15s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--verde)}
.btn-amarelo{background:var(--amarelo);color:var(--verde)}
.btn-branco{background:#fff;color:var(--verde)}
.btn-verde{background:var(--verde);color:var(--creme);box-shadow:3px 3px 0 var(--oliva)}
.btn-verde:hover{box-shadow:4px 4px 0 var(--oliva)}

/* ---------- lacunas listradas ---------- */
.lacuna{width:100%;height:100%;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px;text-align:center;background:repeating-linear-gradient(135deg,var(--papel) 0 10px,var(--linha) 10px 20px);border:2px dashed var(--oliva);border-radius:6px}
.lac-ico{font-size:26px;line-height:1}
.lac-dica{background:var(--papel);color:var(--verde);font-size:13px;line-height:1.35;padding:6px 10px;border-radius:10px;max-width:28ch}

/* ---------- menu ---------- */
.topo{position:sticky;top:0;z-index:50;background:var(--amarelo-claro)}
.topo::after{content:"";position:absolute;left:0;right:0;top:100%;height:12px;background:radial-gradient(circle at 12px 0,var(--amarelo-claro) 11.5px,transparent 12px) 0 0/24px 12px repeat-x;pointer-events:none}
.nav{max-width:1240px;margin:0 auto;padding:0 28px;height:64px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px}
.nav-lado{display:flex;gap:20px}
.nav-lado.dir{justify-content:flex-end}
.nav-lado a,.nav-mobile a{font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-decoration:none}
.nav-lado a:hover{color:var(--oliva)}
.logo{font-family:var(--serifa);font-size:24px;text-decoration:none;white-space:nowrap}
.logo .flor-logo{color:var(--oliva);margin-left:5px;font-size:19px}
.nav-btn{display:none;justify-self:end;background:var(--papel);border:2px solid var(--verde);border-radius:999px;padding:8px 16px;font:700 13px var(--texto);color:var(--verde);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.nav-mobile{display:flex;flex-direction:column;gap:2px;padding:6px 16px 16px;background:var(--amarelo-claro)}
.nav-mobile[hidden]{display:none}
.nav-mobile a{padding:10px 4px;border-bottom:1px solid var(--amarelo)}

/* ---------- capa ---------- */
.capa{padding:70px 0 80px;position:relative}
.capa-grid{display:grid;grid-template-columns:1.12fr .88fr;gap:48px;align-items:center}
.capa-txt{position:relative}
.sobrelinha{font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px}
.capa-nome{font-size:clamp(46px,6.4vw,84px);line-height:.95;letter-spacing:-.01em}
.capa-nichos{font-family:var(--serifa);font-style:italic;color:var(--oliva);font-size:clamp(21px,2.1vw,25px);margin-top:14px}
.capa-frase{margin-top:14px;max-width:50ch;font-size:16px}
.provas{list-style:none;display:flex;flex-wrap:wrap;gap:18px;padding:0;margin:26px 0 0}
.prova{display:flex;flex-direction:column;align-items:center;width:112px;text-align:center}
.prova-selo{position:relative;width:96px;height:96px;display:grid;place-items:center}
.prova-selo svg{position:absolute;inset:0;width:100%;height:100%}
.prova-selo b{position:relative;font-family:var(--serifa);font-weight:500;font-size:25px}
.prova-txt{font-size:13px;font-weight:500;margin-top:6px;line-height:1.3}
.seta-mao{position:absolute;right:-30px;bottom:-6px;width:150px;color:var(--verde)}
.capa-foto{position:relative;max-width:400px;justify-self:center;width:100%}
.polaroid{position:relative;margin:0;background:#fff;padding:10px 10px 14px;box-shadow:0 12px 26px var(--sombra);transform:rotate(var(--rot,0deg))}
.fita{position:absolute;top:-13px;left:50%;width:86px;height:26px;transform:translateX(-50%) rotate(-4deg);background:rgba(232,201,74,.62);z-index:2}
.polaroid-capa{--rot:2.5deg;padding:14px 14px 18px}
.polaroid-capa .fita.f1{left:14%;transform:rotate(-28deg);background:rgba(143,122,42,.55)}
.polaroid-capa .fita.f2{left:auto;right:-16px;transform:rotate(32deg);background:rgba(232,201,74,.7)}
.foto-box{aspect-ratio:4/5;overflow:hidden;background:var(--linha)}
.foto-box img{width:100%;height:100%;object-fit:cover}
.etiqueta-papel{display:inline-block;margin-top:12px;background:var(--creme);border:1.5px solid var(--verde);padding:5px 12px;font-size:13px;border-radius:4px;transform:rotate(-1.5deg)}
.selo-anel{position:absolute;left:-74px;top:36%;width:144px;height:144px;z-index:4}
.selo-anel svg{width:100%;height:100%}
.selo-anel .gira{transform-origin:50% 50%;transform-box:view-box;animation:girar 30s linear infinite}
.selo-anel .miolo{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;color:var(--amarelo)}
@keyframes girar{to{transform:rotate(360deg)}}
.adesivo{position:absolute;font-size:34px;animation:balanco 3.2s ease-in-out infinite;transform-origin:50% 0;z-index:5;filter:drop-shadow(0 3px 2px var(--sombra))}
.adesivo:nth-child(2n){animation-duration:4s;animation-delay:-1s}
@keyframes balanco{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}

/* ---------- folha de caderno ---------- */
.caderno{position:relative;background-color:var(--papel);border-radius:8px;padding:64px clamp(20px,5vw,56px) 46px;box-shadow:0 16px 34px rgba(0,0,0,.2);
  background-image:radial-gradient(circle,var(--furo,var(--oliva)) 7px,transparent 7.5px);background-size:44px 44px;background-repeat:repeat-x;background-position:18px 6px}

/* ---------- sobre ---------- */
.sobre{background:var(--oliva);padding:76px 0}
.sobre-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:44px;align-items:center}
.sobre-txt p+p{margin-top:12px}
.sobre-txt p{font-size:17px}
.sobre-txt h2{margin-bottom:18px}
.polaroid-sobre{--rot:-3deg;max-width:300px;justify-self:center;width:100%}
.polaroid-sobre figcaption{font-family:var(--mao);font-weight:700;font-size:21px;text-align:center;margin-top:8px}
.difs{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--verde);border-radius:14px;overflow:hidden;margin-top:34px}
.dif{padding:20px;border-left:2px solid var(--verde);background:var(--papel)}
.dif:first-child{background:var(--verde);color:var(--creme);border-left:0}
.dif b{display:block;font-family:var(--serifa);font-weight:500;font-size:20px;margin-bottom:6px}
.dif:first-child b{color:var(--amarelo)}
.dif span{font-size:15px}

/* ---------- faixa de marcas ---------- */
.faixa-marcas{background:var(--verde);color:var(--creme);overflow:hidden;padding:15px 0}
.faixa-trilho{display:flex;width:max-content;animation:rolar 60s linear infinite}
.faixa-item{display:flex;align-items:center;gap:28px;padding-right:28px;font-family:var(--serifa);font-size:20px;white-space:nowrap}
.faixa-item img{height:30px;width:auto;filter:brightness(0) invert(1);opacity:.9}
.faixa-item i{font-style:normal;color:var(--amarelo);font-size:16px}
@keyframes rolar{to{transform:translateX(-50%)}}

/* ---------- destaques ---------- */
.destaques{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);min-height:620px}
.destaques>*{min-width:0}
.dest-esq{background:var(--creme);padding:80px clamp(24px,4vw,64px);display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.dest-esq p{margin-top:14px;max-width:38ch}
.dest-dir{background:repeating-linear-gradient(90deg,var(--amarelo-claro) 0 30px,var(--papel) 30px 60px);display:flex;align-items:center;justify-content:center;padding:70px 26px}
.dest-trilho{display:flex;align-items:center;justify-content:center;gap:22px;width:100%;max-width:700px}
.dcard{width:29%;flex:none}
.dcard:nth-child(1){order:2;width:36%;--rot:-1.5deg;z-index:2}
.dcard:nth-child(2){order:1;--rot:-4deg}
.dcard:nth-child(3){order:3;--rot:3.5deg}
.dcard figcaption{margin-top:9px;text-align:center}
.dcard .tit{display:block;font-family:var(--mao);font-weight:700;font-size:22px;line-height:1.1}
.dcard .tags{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.selo-res{position:absolute;top:-30px;right:-30px;width:96px;height:96px;display:grid;place-items:center;z-index:3;transform:rotate(10deg)}
.selo-res svg{position:absolute;inset:0;width:100%;height:100%}
.selo-res b{position:relative;color:var(--amarelo);font-size:13px;line-height:1.15;text-align:center;max-width:70px}

/* ---------- vídeos ---------- */
.vbox{position:relative;aspect-ratio:9/16;overflow:hidden;background:var(--linha);cursor:pointer}
.vbox video,.vbox-yt img{width:100%;height:100%;object-fit:cover}
.vbox-yt img{transition:transform .3s}
.vbox-yt:hover img{transform:scale(1.04)}
.vbox.vazio{cursor:default}
.vplay{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;background:var(--papel);color:var(--verde);display:grid;place-items:center;font-size:15px;box-shadow:0 3px 8px rgba(0,0,0,.2);pointer-events:none}

.xadrez{height:28px;background:repeating-conic-gradient(var(--verde) 0 25%,var(--amarelo) 0 50%) 0 0/28px 28px}

/* ---------- cartão com borda ondulada (nichos e valores) ---------- */
.onda-borda{filter:drop-shadow(4px 5px 0 var(--verde))}
.onda{--r:9px;background:var(--papel);
  -webkit-mask:radial-gradient(var(--r) at 50% 50%,#000 98%,#0000) 0 0/calc(2*var(--r)) calc(2*var(--r)) round,linear-gradient(#000 0 0) 50%/calc(100% - 2*var(--r)) calc(100% - 2*var(--r)) no-repeat;
          mask:radial-gradient(var(--r) at 50% 50%,#000 98%,#0000) 0 0/calc(2*var(--r)) calc(2*var(--r)) round,linear-gradient(#000 0 0) 50%/calc(100% - 2*var(--r)) calc(100% - 2*var(--r)) no-repeat}

/* ---------- nichos ---------- */
.nichos{background:var(--salvia);padding:80px 0 90px}
.atalhos{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:26px 0 46px}
.atalhos a{border:2px solid var(--verde);background:var(--papel);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:700;text-decoration:none}
.atalhos a:hover{background:var(--amarelo-claro)}
.atalhos a span{color:var(--oliva);margin-right:6px}
.pag-borda{scroll-margin-top:90px}
.pag-borda+.pag-borda{margin-top:44px}
.pagina{padding:40px clamp(20px,4vw,46px) 34px}
.pag-topo{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.pag-num{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;background:var(--amarelo-claro);border-radius:999px;padding:4px 12px}
.pag-topo h3{font-size:clamp(30px,4vw,44px);margin-top:8px}
.pag-qtd{font-size:22px;color:var(--oliva)}
.setas{display:flex;gap:10px}
.seta-btn{width:46px;height:46px;border-radius:50%;border:0;background:var(--verde);color:var(--creme);font-size:20px;cursor:pointer;display:grid;place-items:center}
.seta-btn:hover{background:var(--oliva)}
.carrossel{--gap:20px;display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 3*var(--gap))/4);gap:var(--gap);overflow-x:auto;scroll-snap-type:x mandatory;padding:26px 6px 18px;margin-top:8px;scrollbar-width:thin;scrollbar-color:var(--oliva) transparent;cursor:grab}
.carrossel.arrastando{scroll-snap-type:none;cursor:grabbing;user-select:none}
.ncard{scroll-snap-align:start}
.ncard:nth-child(4n+1){--rot:-2deg}.ncard:nth-child(4n+2){--rot:1.5deg}.ncard:nth-child(4n+3){--rot:-1deg}.ncard:nth-child(4n){--rot:2deg}
.ncard figcaption{font-family:var(--mao);font-weight:700;font-size:19px;text-align:center;margin-top:7px;min-height:1.2em;line-height:1.15}
.ncard .lacuna{aspect-ratio:9/16;height:auto}

/* ---------- galeria ---------- */
.galeria{background:var(--creme);padding:84px 0 90px}
.fotos{display:grid;grid-template-columns:repeat(4,1fr);gap:34px 26px;margin-top:46px}
.gcard:nth-child(4n+1){--rot:-2.5deg}.gcard:nth-child(4n+2){--rot:1.8deg}.gcard:nth-child(4n+3){--rot:-1.2deg}.gcard:nth-child(4n){--rot:2.4deg}
.gcard .fbox{aspect-ratio:4/5;overflow:hidden;background:var(--linha);cursor:zoom-in}
.gcard .fbox img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.gcard .fbox:hover img{transform:scale(1.04)}
.gcard figcaption{font-family:var(--mao);font-weight:700;font-size:20px;text-align:center;margin-top:8px;line-height:1.1}

/* ---------- métricas ---------- */
.metricas{background:var(--verde);color:var(--creme);padding:84px 0 90px}
.metricas .etiqueta{background:var(--amarelo);border-color:var(--amarelo)}
.metricas h2{color:var(--creme)}
.redes{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:46px}
.rede{position:relative;background:var(--papel);color:var(--verde);padding:34px 28px 28px;border-radius:6px;box-shadow:0 14px 30px rgba(0,0,0,.3);transform:rotate(var(--rot))}
.rede:nth-child(1){--rot:-1deg}.rede:nth-child(2){--rot:1deg}
.rede-topo{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--verde);padding-bottom:12px}
.rede-topo h3{font-size:28px}
.rede-topo a{font-size:13px;font-weight:700}
.periodo{font-family:var(--mao);font-weight:700;font-size:20px;color:var(--oliva);width:100%}
.nums{display:grid;grid-template-columns:repeat(2,1fr);gap:0;margin-top:6px}
.num{padding:14px 4px;border-bottom:1px dashed var(--linha)}
.num b{display:block;font-family:var(--serifa);font-weight:500;font-size:30px;line-height:1.05}
.num span{font-size:13.5px}
.num.forte b{font-size:40px;color:var(--verde)}
.num.forte{background:linear-gradient(transparent 62%,var(--amarelo-claro) 62%)}
.publico{margin-top:18px}
.publico h4{margin:0 0 10px;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.barra{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px;margin-bottom:9px}
.barra i{grid-column:1/-1;height:8px;border-radius:99px;background:var(--linha);overflow:hidden}
.barra i::before{content:"";display:block;height:100%;width:var(--p);background:var(--oliva);border-radius:99px}
.nota-met{margin-top:34px;text-align:center;font-size:14px;opacity:.9}

/* ---------- o que as marcas falam ---------- */
.feedback{padding:84px 0}
.bilhetes{display:grid;grid-template-columns:repeat(3,1fr);gap:34px;margin-top:44px}
.bilhete-card{position:relative;margin:0;padding:34px 24px 22px;box-shadow:0 10px 22px var(--sombra);transform:rotate(var(--rot))}
.bilhete-card:nth-child(1){background:var(--amarelo-claro);--rot:-2deg}
.bilhete-card:nth-child(2){background:var(--salvia);--rot:1.5deg}
.bilhete-card:nth-child(3){background:var(--amarelo);--rot:-1deg}
.bilhete-card blockquote{margin:0;font-family:var(--serifa);font-size:19px;line-height:1.35}
.bilhete-card img{width:100%;border-radius:4px}
.bilhete-card figcaption{margin-top:14px}
.bilhete-card .marca{font-family:var(--mao);font-weight:700;font-size:26px;display:block}
.bilhete-card .det{font-size:13px}

/* ---------- valores ---------- */
.valores{background:var(--salvia);padding:84px 0 90px}
.grupo-tit{font-family:var(--mao);font-weight:700;font-size:28px;margin:44px 0 18px;text-align:center}
.planos{display:flex;flex-wrap:wrap;justify-content:center;gap:28px}
.plano-borda{width:calc((100% - 56px)/3);min-width:250px;max-width:340px}
.plano{height:100%;padding:34px 26px 28px;display:flex;flex-direction:column}
.plano h3{font-size:24px}
.preco{margin-top:10px;font-family:var(--serifa);font-size:36px;line-height:1}
.preco s{font-size:18px;color:var(--oliva);margin-right:8px}
.plano ul{list-style:none;padding:0;margin:18px 0 22px;flex:1}
.plano li{padding:7px 0 7px 26px;position:relative;font-size:15px;border-bottom:1px dashed var(--linha)}
.plano li::before{content:"✓";position:absolute;left:2px;color:var(--oliva);font-weight:700}
.plano .btn{width:100%}
.plano.destaque{background:var(--verde);color:var(--creme)}
.plano.destaque li{border-color:rgba(233,229,218,.25)}
.plano.destaque li::before,.plano.destaque .preco s{color:var(--amarelo)}
.plano.destaque .btn{background:var(--amarelo);color:var(--verde);border-color:var(--amarelo);box-shadow:3px 3px 0 var(--oliva)}
.selo-rec{display:inline-block;align-self:flex-start;background:var(--amarelo);color:var(--verde);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:4px 12px;margin-bottom:10px}
.nota-valores{text-align:center;margin-top:38px;font-size:15px}

/* ---------- contato ---------- */
.contato{background:repeating-linear-gradient(90deg,var(--amarelo-claro) 0 30px,var(--papel) 30px 60px);padding:80px 0 90px}
.contato .caderno{--furo:var(--amarelo-claro);max-width:860px;margin:0 auto;text-align:center}
.chamado{font-size:28px;color:var(--oliva);margin-top:10px}
.contato .botoes{justify-content:center}
.orcamento{margin:40px auto 0;max-width:640px;text-align:left;background:var(--papel);border:2px solid var(--verde);border-radius:16px;padding:24px}
.orcamento h3{font-size:24px;margin-bottom:14px}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.campos label{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:700}
.campos label:last-child{grid-column:1/-1}
.campos input{font:16px var(--texto);color:var(--verde);background:#fff;border:1.5px solid var(--linha);border-radius:10px;padding:11px 12px}
.campos input:focus{border-color:var(--verde);outline:none;box-shadow:0 0 0 3px var(--amarelo-claro)}
.gotcha{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.orcamento .btn{margin-top:16px;width:100%}
.form-msg{margin-top:12px;font-size:15px}
.form-ok{font-family:var(--serifa);font-size:24px;text-align:center;padding:20px 0}
.duvidas-tit{margin-top:48px;font-size:26px}
.duvidas{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--verde);border-radius:14px;overflow:hidden;margin-top:18px;text-align:left}
.duvida{padding:18px 20px;background:var(--papel)}
.duvida:nth-child(odd){border-right:2px solid var(--verde)}
.duvida:nth-child(-n+2){border-bottom:2px solid var(--verde)}
.duvida b{display:block;font-family:var(--serifa);font-weight:500;font-size:18px;margin-bottom:6px}
.duvida span{font-size:15px}

/* ---------- rodapé ---------- */
.rodape{position:relative;background:var(--verde);color:var(--creme);text-align:center;padding:48px 16px 96px;margin-top:12px}
.rodape::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:12px;background:radial-gradient(circle at 12px 12px,var(--verde) 11.5px,transparent 12px) 0 0/24px 12px repeat-x}
.rod-nome{font-family:var(--serifa);font-size:28px}
.rodape p+p{margin-top:6px;font-size:14px}
.rodape .mao{color:var(--amarelo);font-size:24px}

/* ---------- WhatsApp fixo ---------- */
.wa-fixo{position:fixed;right:16px;bottom:16px;z-index:60;width:52px;height:52px;border-radius:50%;background:var(--amarelo);color:var(--verde);display:grid;place-items:center;border:2px solid var(--verde);box-shadow:3px 3px 0 var(--verde)}
.wa-fixo svg{width:26px;height:26px}

/* ---------- player ---------- */
.player{position:fixed;inset:0;z-index:100;background:rgba(15,24,19,.88);display:flex;align-items:center;justify-content:center;padding:20px}
.player[hidden],.player [hidden]{display:none}
.player-caixa{position:relative;display:flex;flex-direction:column;align-items:center}
.player video,.yt-frame{height:min(84vh,calc(92vw*16/9));width:auto;max-width:92vw;aspect-ratio:9/16;background:#000;border-radius:10px;border:0}
/* YouTube: o vídeo fica um pouco maior que a moldura pra esconder a faixa de cima (título e marca Shorts) */
.yt-frame{position:relative;overflow:hidden}
.yt-frame iframe{position:absolute;top:-72px;left:-20px;width:calc(100% + 40px);height:calc(100% + 72px);border:0}
.player img{max-height:84vh;max-width:92vw;border-radius:10px;background:#000}
.player-tit{color:var(--creme);margin-top:10px;font-family:var(--mao);font-size:22px}
.player-tit a{color:var(--amarelo);font-family:var(--texto);font-size:14px;font-weight:700}
.player-x{position:absolute;top:-14px;right:-14px;width:44px;height:44px;border-radius:50%;border:2px solid var(--verde);background:var(--creme);color:var(--verde);font-size:24px;cursor:pointer;line-height:1}

/* ---------- responsivo ---------- */
@media (max-width:1120px){
  .nav-lado{display:none}
  .nav{grid-template-columns:1fr auto}
  .nav-btn{display:inline-block}
}
@media (min-width:1121px){ .nav-mobile{display:none!important} }
@media (max-width:980px){
  .destaques{grid-template-columns:minmax(0,1fr)}
  .dest-esq{padding:64px 28px 40px}
  .carrossel{grid-auto-columns:calc((100% - var(--gap))/2)}
  .fotos{grid-template-columns:repeat(3,1fr)}
  .redes{grid-template-columns:1fr;max-width:560px;margin-left:auto;margin-right:auto}
  .plano-borda{width:calc((100% - 28px)/2)}
}
@media (max-width:860px){
  .capa-grid,.sobre-grid{grid-template-columns:1fr}
  .seta-mao{display:none}
  .capa-foto{max-width:360px}
  .selo-anel{left:-30px;top:-34px}
  .bilhetes{grid-template-columns:1fr;max-width:460px;margin-left:auto;margin-right:auto}
}
@media (max-width:520px){
  .wrap,.nav{padding:0 16px}
  .capa{padding:42px 0 60px}
  .adesivo{display:none}
  .capa-foto{max-width:300px;margin-top:20px}
  .selo-anel{left:-14px;top:-40px}
  .provas{gap:8px;justify-content:space-between}
  .prova{width:31%}
  .prova-selo{width:84px;height:84px}
  .prova-selo b{font-size:22px}
  .botoes .btn{width:100%}
  .sobre,.contato{padding:52px 0}
  .caderno{padding:56px 18px 34px}
  .difs{grid-template-columns:1fr}
  .dif{border-left:0;border-top:2px solid var(--verde)}
  .dif:first-child{border-top:0}
  .dest-esq{padding:52px 16px 30px}
  .dest-dir{padding:46px 0 34px;display:block}
  .dest-trilho{justify-content:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;padding:30px 16px 16px;gap:18px}
  .dcard,.dcard:nth-child(1){width:72%;order:0;scroll-snap-align:center}
  .selo-res{right:-6px}
  .nichos,.feedback,.galeria,.metricas,.valores{padding:56px 0}
  .pagina{padding:34px 16px 26px}
  .carrossel{--gap:14px;grid-auto-columns:78%}
  .fotos{grid-template-columns:repeat(2,1fr);gap:24px 14px}
  .gcard{padding:7px 7px 10px}
  .gcard figcaption{font-size:17px}
  .rede{padding:30px 18px 22px}
  .num b{font-size:26px}
  .num.forte b{font-size:32px}
  .plano-borda{width:100%;max-width:none}
  .campos{grid-template-columns:1fr}
  .duvidas{grid-template-columns:1fr}
  .duvida:nth-child(odd){border-right:0}
  .duvida:not(:last-child){border-bottom:2px solid var(--verde)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .faixa-trilho{flex-wrap:wrap;width:auto;justify-content:center}
}
</style>
</head>
<body>

<header class="topo">
  <nav class="nav" aria-label="Menu principal">
    <div class="nav-lado esq"><a href="#sobre">Sobre mim</a><a href="#destaques">Destaques</a><a href="#nichos">Nichos</a><a href="#galeria">Galeria</a></div>
    <a class="logo" href="#inicio"><span id="logoNome"></span><span class="flor-logo" aria-hidden="true">✿</span></a>
    <div class="nav-lado dir"><a href="#metricas">Métricas</a><a href="#feedback">Feedback</a><a href="#valores">Valores</a><a href="#contato">Contato</a></div>
    <button class="nav-btn" type="button" aria-expanded="false" aria-controls="navMobile">menu</button>
  </nav>
  <div class="nav-mobile" id="navMobile" hidden>
    <a href="#sobre">Sobre mim</a><a href="#destaques">Destaques</a><a href="#nichos">Nichos</a><a href="#galeria">Galeria</a><a href="#metricas">Métricas</a><a href="#feedback">O que as marcas falam</a><a href="#valores">Valores</a><a href="#contato">Contato</a>
  </div>
</header>

<main>
  <section id="inicio" class="capa quadriculado"></section>
  <section id="sobre" class="sobre"></section>
  <div id="faixaMarcas" class="faixa-marcas" aria-label="Marcas com quem já trabalhei"></div>
  <section id="destaques" class="destaques"></section>
  <div class="xadrez" aria-hidden="true"></div>
  <section id="nichos" class="nichos"></section>
  <section id="galeria" class="galeria"></section>
  <section id="metricas" class="metricas"></section>
  <section id="feedback" class="feedback quadriculado"></section>
  <section id="valores" class="valores"></section>
  <section id="contato" class="contato"></section>
</main>
<footer class="rodape" id="rodape"></footer>

<a class="wa-fixo" id="waFixo" href="#contato" target="_blank" rel="noopener" aria-label="Falar comigo no WhatsApp">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 20.5l1.4-4.2A8.5 8.5 0 1 1 8 19.3z"/><path d="M9 9.5c.3 2 2.2 4 4.5 4.6l1-1.1 2 .8-.4 1.6c-3.8.3-7.4-3.2-7.2-7l1.6-.4.8 2z" fill="currentColor" stroke="none"/></svg>
</a>

<div class="player" id="player" hidden role="dialog" aria-modal="true" aria-label="Mídia ampliada">
  <div class="player-caixa">
    <video controls playsinline hidden></video>
    <div class="yt-frame" hidden><iframe title="Vídeo" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>
    <img alt="" hidden>
    <p class="player-tit"></p>
    <button class="player-x" type="button" aria-label="Fechar">×</button>
  </div>
</div>

<script>
/* =====================================================================
   MOTOR DA PÁGINA. Você não precisa mexer aqui: troque só o DADOS lá embaixo.
   ===================================================================== */
const reduzMovimento = matchMedia('(prefers-reduced-motion: reduce)').matches;
const temMouse = matchMedia('(hover: hover) and (pointer: fine)').matches;
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = t => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
  .trim().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '').replace(/-+/g, '-');
const primeiroNome = () => (DADOS.nome || '').split(' ')[0];
const COR = { verde: '#1b2b22', oliva: '#8f7a2a', creme: '#e9e5da', amarelo: '#e8c94a', claro: '#f3e3a0' };

/* Selo ondulado (flor/carimbo) em SVG */
function florPath(n = 14, r = 41) {
  const cx = 50, cy = 50, pico = 49, cR = 2 * pico - r * Math.cos(Math.PI / n);
  let d = '';
  for (let i = 0; i < n; i++) {
    const a0 = i / n * 2 * Math.PI, a1 = (i + .5) / n * 2 * Math.PI, a2 = (i + 1) / n * 2 * Math.PI;
    const p = a => [(cx + r * Math.cos(a)).toFixed(2), (cy + r * Math.sin(a)).toFixed(2)];
    if (!i) d += 'M' + p(a0);
    d += ' Q' + (cx + cR * Math.cos(a1)).toFixed(2) + ',' + (cy + cR * Math.sin(a1)).toFixed(2) + ' ' + p(a2);
  }
  return d + 'Z';
}
const flor = (cor, n) => `<svg viewBox="0 0 100 100" aria-hidden="true"><path d="${florPath(n)}" fill="${cor}"/></svg>`;

/* Lacuna listrada com ícone e dica */
const lacuna = (ico, dica) => `<div class="lacuna"><span class="lac-ico" aria-hidden="true">${ico}</span><span class="lac-dica">${esc(dica)}</span></div>`;

/* Foto: se o arquivo não existir, vira lacuna */
function foto(src, alt, ico, dica) {
  if (!src) return lacuna(ico, dica);
  return `<img src="${esc(src)}" alt="${esc(alt)}" data-ico="${ico}" data-dica="${esc(dica)}" onerror="semFoto(this)">`;
}
function semFoto(img) { const box = img.parentElement; box.classList.add('vazio'); box.innerHTML = lacuna(img.dataset.ico, img.dataset.dica); }

/* Vídeo: miniatura com #t=0.1; se faltar o arquivo, vira lacuna */
const linkExterno = s => /instagram\.com|tiktok\.com|drive\.google/i.test(s);
/* YouTube: pega o código do vídeo de links de Shorts, youtu.be ou watch?v= */
const ytId = s => (String(s).match(/(?:youtube\.com\/(?:shorts\/|watch\?v=|embed\/)|youtu\.be\/)([\w-]{11})/) || [])[1];
function videoBox(src, o = {}) {
  if (!src) return `<div class="vbox vazio">${lacuna('🎬', o.dica)}</div>`;
  if (linkExterno(src)) return `<div class="vbox vazio">${lacuna('⚠️', 'Link de Instagram, TikTok ou Drive não toca aqui: use o .mp4 ou um link do YouTube')}</div>`;
  const yt = ytId(src);
  if (yt) {
    const t = o.titulo || 'vídeo';
    return `<div class="vbox vbox-yt" role="button" tabindex="0" aria-label="Assistir: ${esc(t)}" data-yt="${yt}" data-titulo="${esc(t)}">
      <img src="${esc(o.capa || `https://i.ytimg.com/vi/${yt}/hqdefault.jpg`)}" alt="" loading="lazy">
      <span class="vplay" aria-hidden="true">▶</span></div>`;
  }
  const tit = o.titulo || src.split('/').pop().replace(/\.mp4$/i, '');
  const auto = o.auto && !reduzMovimento ? ' autoplay' : '';
  return `<div class="vbox${o.auto ? ' vbox-auto' : ''}" role="button" tabindex="0" aria-label="Assistir: ${esc(tit)}" data-src="${esc(src)}" data-titulo="${esc(tit)}" data-dica="${esc(o.dica)}">
    <video muted loop playsinline${auto} preload="metadata" draggable="false"${o.capa ? ` poster="${esc(o.capa)}"` : ''} src="${esc(src)}#t=0.1" onerror="semVideo(this)"></video>
    <span class="vplay" aria-hidden="true">▶</span></div>`;
}
function semVideo(v) {
  const box = v.closest('.vbox');
  box.className = 'vbox vazio';
  box.removeAttribute('role'); box.removeAttribute('tabindex'); box.removeAttribute('aria-label');
  box.innerHTML = lacuna('🎬', box.dataset.dica);
}

/* Links de contato */
function linkWhats(assunto) {
  let n = String(DADOS.whatsapp || '').replace(/\D/g, '');
  if (!n) return `mailto:${DADOS.email}?subject=${encodeURIComponent(assunto || 'Vídeos UGC pra minha marca')}`;
  if (n.length <= 11) n = '55' + n;
  const msg = assunto
    ? `Oi, ${primeiroNome()}! Vi seu portfólio e quero conversar sobre o ${assunto}.`
    : `Oi, ${primeiroNome()}! Vi seu portfólio e quero conversar sobre vídeos pra minha marca.`;
  return `https://wa.me/${n}?text=${encodeURIComponent(msg)}`;
}
const formOk = () => /^https:\/\/formspree\.io\/f\/\w+/.test(DADOS.formspree || '');

/* ------------------------- MONTAGEM ------------------------- */
function montar() {
  const D = DADOS;
  $('#logoNome').textContent = D.nome;
  const wa = linkWhats();
  $('#waFixo').href = wa;
  if (!D.whatsapp) $('#waFixo').setAttribute('aria-label', 'Mandar e-mail');

  /* 1. CAPA */
  const cores = [[COR.amarelo, COR.verde], [COR.verde, COR.amarelo], [COR.oliva, '#ffffff']];
  $('#inicio').innerHTML = `
  <div class="wrap capa-grid">
    <div class="capa-txt">
      <p class="sobrelinha">(${esc(D.titulo)} · ${esc(D.cidade)})</p>
      <h1 class="capa-nome">${esc(D.nome)}</h1>
      <p class="capa-nichos">UGC creator e influencer de ${esc(D.nichosResumo)}</p>
      <p class="capa-frase">${esc(D.frase)}</p>
      <ul class="provas">${D.provas.map((p, i) => `
        <li class="prova"><span class="prova-selo">${flor(cores[i % 3][0], 12)}<b style="color:${cores[i % 3][1]}">${esc(p.numero)}</b></span><span class="prova-txt">${esc(p.texto)}</span></li>`).join('')}
      </ul>
      <div class="botoes">
        <a class="btn btn-amarelo" href="#destaques">Ver meus melhores vídeos</a>
        <a class="btn btn-branco" href="#contato">Falar comigo</a>
      </div>
      <svg class="seta-mao" viewBox="0 0 160 90" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 74c22 12 62 14 92-6 18-12 30-30 40-50"/><path d="M124 22l17-6 3 18"/></svg>
    </div>
    <div class="capa-foto">
      <div class="selo-anel" role="img" aria-label="${esc(D.titulo)} ${esc(D.nome)}">
        <svg viewBox="0 0 100 100" aria-hidden="true"><g class="gira">
          <path d="${florPath(16, 43)}" fill="${COR.verde}"/>
          <defs><path id="anelTxt" d="M50,50 m-34,0 a34,34 0 1,1 68,0 a34,34 0 1,1 -68,0"/></defs>
          <text fill="${COR.amarelo}" font-family="DM Sans, sans-serif" font-weight="700" font-size="9"><textPath href="#anelTxt" textLength="211" lengthAdjust="spacing">${esc(D.titulo.toUpperCase())} ♥ ${esc(D.nome.toUpperCase())} ♥</textPath></text>
        </g></svg>
        <span class="miolo" aria-hidden="true">✿</span>
      </div>
      <figure class="polaroid polaroid-capa">
        <span class="fita f1"></span><span class="fita f2"></span>
        <div class="foto-box">${foto(D.fotoCapa, 'Foto de ' + D.nome, '📷', 'Retrato com rosto, luz natural e ambiente real · midia/galeria/capa.jpg')}</div>
        <figcaption><span class="etiqueta-papel">Vídeos feitos por: <b>${esc(D.nome)}</b></span></figcaption>
      </figure>
      <span class="adesivo" style="top:-26px;right:12%" aria-hidden="true">💄</span>
      <span class="adesivo" style="top:28%;right:-38px" aria-hidden="true">🌿</span>
      <span class="adesivo" style="bottom:-20px;left:8%" aria-hidden="true">🎬</span>
      <span class="adesivo" style="bottom:22%;left:-50px" aria-hidden="true">📸</span>
    </div>
  </div>`;

  /* 2. SOBRE MIM */
  $('#sobre').innerHTML = `
  <div class="wrap"><div class="caderno">
    <div class="sobre-grid">
      <div class="sobre-txt">
        <span class="etiqueta">Sobre mim</span>
        <h2>Prazer, eu sou a ${esc(primeiroNome())}</h2>
        ${(D.sobreTexto || []).filter(Boolean).map(p => `<p>${esc(p)}</p>`).join('')}
      </div>
      <figure class="polaroid polaroid-sobre"><span class="fita"></span>
        <div class="foto-box">${foto(D.fotoSobre, D.nome + ' no dia a dia', '☕', 'Você no dia a dia, na sua rotina real · midia/galeria/sobre.jpg')}</div>
        <figcaption>eu no dia a dia</figcaption>
      </figure>
    </div>
    <div class="difs">${D.diferenciais.map(d => `<div class="dif"><b>${esc(d.titulo)}</b><span>${esc(d.texto)}</span></div>`).join('')}</div>
  </div></div>`;

  /* Faixa de marcas (rolando devagar) */
  const itens = D.marcas.map(m => `<span class="faixa-item">${m.logo ? `<img src="${esc(m.logo)}" alt="${esc(m.nome)}" onerror="this.replaceWith(document.createTextNode(this.alt))">` : esc(m.nome)}<i aria-hidden="true">✿</i></span>`);
  let fila = []; while (fila.length < 10 && itens.length) fila = fila.concat(itens);
  if (D.marcas.length) $('#faixaMarcas').innerHTML = `<div class="faixa-trilho">${fila.join('')}<span aria-hidden="true" style="display:contents">${reduzMovimento ? '' : fila.join('')}</span></div>`;
  else $('#faixaMarcas').remove();

  /* 3. DESTAQUES */
  $('#destaques').innerHTML = `
  <div class="dest-esq">
    <span class="etiqueta">Destaques</span>
    <h2>Meus melhores vídeos</h2>
    <p>Os três vídeos que mais mostram o meu trabalho. Toque ou clique pra assistir com som.</p>
    <div class="botoes"><a class="btn btn-verde" href="#nichos">Ver conteúdo por nichos</a></div>
  </div>
  <div class="dest-dir"><div class="dest-trilho">${D.destaques.slice(0, 3).map((v, i) => `
    <figure class="polaroid dcard"><span class="fita"></span>
      ${v.res ? `<span class="selo-res">${flor(COR.verde, 14)}<b>${esc(v.res)}</b></span>` : ''}
      ${videoBox(v.video, { auto: i === 0, capa: v.capa, titulo: v.titulo, dica: `Vídeo ${v.titulo || i + 1}: coloque o arquivo em midia/destaques/${i + 1}.mp4` })}
      <figcaption>
        <span class="tit">${esc(v.titulo || 'título curto do vídeo')}</span>
        <span class="tags">${[v.nicho, v.formato].filter(Boolean).map(esc).join(' · ')}</span>
      </figcaption>
    </figure>`).join('')}
  </div></div>`;

  /* 4. NICHOS (uma página por nicho, com carrossel) */
  $('#nichos').innerHTML = `
  <div class="wrap">
    <div class="centro">
      <span class="etiqueta">Conteúdo por nichos</span>
      <h2>Ache o vídeo do seu nicho</h2>
      <nav class="atalhos" aria-label="Atalhos dos nichos">${D.nichos.map((n, i) => `<a href="#nicho-${slug(n.nome)}"><span>${String(i + 1).padStart(2, '0')}</span>${esc(n.nome)}</a>`).join('')}</nav>
    </div>
    ${D.nichos.map((n, i) => {
      const vids = (n.videos || []).map(v => typeof v === 'string' ? { video: v } : v);
      const pasta = `midia/nichos/${slug(n.nome)}/`;
      const cards = vids.map(v => `<figure class="polaroid ncard"><span class="fita"></span>${videoBox(v.video, { titulo: v.titulo, capa: v.capa, dica: 'Vídeo não encontrado: confira o nome em ' + pasta })}<figcaption>${esc(v.titulo || '')}</figcaption></figure>`);

/* ------------------------- INTERAÇÕES ------------------------- */
function ligarInteracoes() {
  const bt = $('.nav-btn'), nm = $('#navMobile');
  bt.addEventListener('click', () => { const abre = nm.hidden; nm.hidden = !abre; bt.setAttribute('aria-expanded', abre); bt.textContent = abre ? 'fechar' : 'menu'; });
  nm.addEventListener('click', e => { if (e.target.closest('a')) { nm.hidden = true; bt.setAttribute('aria-expanded', false); bt.textContent = 'menu'; } });

  /* 1º destaque: toca sozinho, sem som, quando aparece */
  const auto = $('.vbox-auto video');
  if (auto && !reduzMovimento && 'IntersectionObserver' in window) {
    new IntersectionObserver(([e]) => { e.isIntersecting ? auto.play().catch(() => {}) : auto.pause(); }, { threshold: .35 }).observe(auto);
  }
  /* os outros: no computador tocam sem som ao passar o mouse */
  if (temMouse) document.querySelectorAll('.vbox:not(.vbox-auto)').forEach(b => {
    b.addEventListener('mouseenter', () => { const v = b.querySelector('video'); if (v) { v.muted = true; v.play().catch(() => {}); } });
    b.addEventListener('mouseleave', () => { const v = b.querySelector('video'); if (v) { v.pause(); v.currentTime = .1; } });
  });

  /* clique/toque abre o player (vídeo ou foto) */
  const alvoMidia = el => el.closest('.vbox, .fbox');
  document.addEventListener('click', e => {
    const b = alvoMidia(e.target);
    if (!b || b.classList.contains('vazio')) return;
    const tr = b.closest('.carrossel'); if (tr && tr.dataset.arrastou) return;
    abrirPlayer(b);
  });
  document.addEventListener('keydown', e => {
    const b = e.target.classList && (e.target.classList.contains('vbox') || e.target.classList.contains('fbox')) ? e.target : null;
    if ((e.key === 'Enter' || e.key === ' ') && b && !b.classList.contains('vazio')) { e.preventDefault(); abrirPlayer(b); }
    if (e.key === 'Escape' && !$('#player').hidden) fecharPlayer();
  });
  $('#player').addEventListener('click', e => { if (e.target.id === 'player' || e.target.closest('.player-x')) fecharPlayer(); });

  /* carrosséis dos nichos: setas + arrastar com o mouse */
  document.querySelectorAll('.seta-btn').forEach(s => s.addEventListener('click', () => {
    const tr = s.closest('.pagina').querySelector('.carrossel');
    tr.scrollBy({ left: Number(s.dataset.dir) * tr.clientWidth, behavior: reduzMovimento ? 'auto' : 'smooth' });
  }));
  document.querySelectorAll('.carrossel').forEach(tr => {
    let ativo = false, arrastou = false, x0 = 0, s0 = 0;
    tr.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') return; ativo = true; arrastou = false; x0 = e.clientX; s0 = tr.scrollLeft; });
    tr.addEventListener('pointermove', e => {
      if (!ativo) return; const dx = e.clientX - x0;
      if (Math.abs(dx) > 6) { if (!arrastou) { arrastou = true; tr.classList.add('arrastando'); } tr.scrollLeft = s0 - dx; }
    });
    const fim = () => { if (!ativo) return; ativo = false; tr.classList.remove('arrastando');
      if (arrastou) { tr.dataset.arrastou = '1'; setTimeout(() => delete tr.dataset.arrastou, 60); } };
    tr.addEventListener('pointerup', fim); tr.addEventListener('pointerleave', fim);
  });

  /* formulário (Formspree) */
  const f = $('#orcamento');
  if (f) f.addEventListener('submit', async e => {
    e.preventDefault();
    const msg = f.querySelector('.form-msg'), btn = f.querySelector('button');
    btn.disabled = true; msg.textContent = 'Enviando…';
    try {
      const r = await fetch(DADOS.formspree, { method: 'POST', headers: { Accept: 'application/json' }, body: new FormData(f) });
      if (!r.ok) throw new Error();
      f.innerHTML = '<p class="form-ok">Recebi! Te chamo em breve.</p>';
    } catch {
      btn.disabled = false;
      msg.innerHTML = `Não consegui enviar agora. Me chama direto: <a class="btn btn-verde" style="margin-top:10px;width:100%" href="${esc(linkWhats())}" target="_blank" rel="noopener">💬 Chamar no WhatsApp</a>`;
    }
  });
}

let ultimoFoco = null;
function abrirPlayer(box) {
  const p = $('#player'), v = p.querySelector('video'), im = p.querySelector('img'), fr = p.querySelector('iframe'), yw = p.querySelector('.yt-frame');
  document.querySelectorAll('.vbox video').forEach(x => x.pause());
  ultimoFoco = box;
  p.querySelector('.player-tit').textContent = box.dataset.titulo || '';
  v.hidden = im.hidden = yw.hidden = true;
  if (box.dataset.foto) {
    im.src = box.dataset.foto; im.alt = box.dataset.titulo || ''; im.hidden = false;
  } else {
    if (box.dataset.yt) {
      fr.src = `https://www.youtube.com/embed/${box.dataset.yt}?autoplay=1&playsinline=1&rel=0&modestbranding=1&iv_load_policy=3&vq=hd1080`; yw.hidden = false;
    } else {
      v.src = box.dataset.src; v.muted = false; v.hidden = false;
      v.play().catch(() => {});
    }
    if (window.umami && typeof window.umami.track === 'function') { // métrica: vídeo mais visto
      try { window.umami.track(slug('video-' + box.dataset.titulo).slice(0, 50)); } catch (e) {}
    }
  }
  p.hidden = false; document.body.style.overflow = 'hidden';
  p.querySelector('.player-x').focus();
}
function fecharPlayer() {
  const p = $('#player'), v = p.querySelector('video');
  v.pause(); v.removeAttribute('src'); v.load();
  p.querySelector('img').removeAttribute('src');
  p.querySelector('iframe').removeAttribute('src');
  p.hidden = true; document.body.style.overflow = '';
  if (ultimoFoco) ultimoFoco.focus();
  const auto = $('.vbox-auto video'); if (auto && !reduzMovimento) auto.play().catch(() => {});
}
