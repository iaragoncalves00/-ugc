<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iara Gonçalves · portfólio UGC</title>
<meta name="description" content="Iara Gonçalves, UGC creator em Brasília: vídeos com vida real e storytelling para marcas de saúde, beleza, moda e lifestyle.">

<!-- Prévia do link no WhatsApp. TROQUE "MEU-LINK" pelo endereço do site depois de publicar -->
<meta property="og:title" content="Iara Gonçalves · portfólio UGC">
<meta property="og:description" content="Sou fisioterapeuta e criadora de conteúdo, especializada em storytelling para marcas de saúde, beleza, fashion e lifestyle. Meu conteúdo combina vida real, comunicação natural e uma estética cuidadosa para apresentar produtos de um jeito que não parece publicidade, mas desperta identificação, desejo e ação.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://MEU-LINK/">
<meta property="og:image" content="https://MEU-LINK/midia/capa.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&display=swap" rel="stylesheet">

<style>
:root{
  --creme:#FDF6EE; --papel:#FFFBF6; --vinho:#7A1430; --verm:#D2283A;
  --rosa:#F9C9D6; --rosa2:#F48FB1; --lilas:#C9C6FF; --pessego:#F9A27C; --linha:#F2D3D9;
  --serifa:"Fraunces", Georgia, serif; --texto:"DM Sans", system-ui, sans-serif; --mao:"Caveat", cursive;
}
*{box-sizing:border-box}
html{overflow-x:clip}
@media (prefers-reduced-motion:no-preference){ html{scroll-behavior:smooth} }
body{margin:0;background:var(--creme);color:var(--vinho);font-family:var(--texto);font-size:16px;line-height:1.55;overflow-x:clip}
img,video{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3{font-family:var(--serifa);font-weight:500;margin:0;line-height:1.1}
h2{font-size:clamp(28px,4vw,44px)}
h3{font-size:clamp(22px,2.6vw,30px)}
p{margin:0}
:focus-visible{outline:3px solid var(--verm);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding:0 28px}
section{scroll-margin-top:84px}
.mao{font-family:var(--mao);font-weight:700}
.etiqueta-rosa{display:inline-block;background:var(--rosa);color:var(--vinho);border:1.5px solid var(--vinho);border-radius:999px;padding:5px 13px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px}
.quadriculado{background-color:var(--papel);background-image:linear-gradient(var(--linha) 1px,transparent 1px),linear-gradient(90deg,var(--linha) 1px,transparent 1px);background-size:26px 26px}

/* ---------- botões ---------- */
.botoes{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:999px;border:2px solid var(--vinho);font-family:var(--texto);font-size:15px;font-weight:700;text-decoration:none;cursor:pointer;box-shadow:3px 3px 0 var(--vinho);transition:transform .15s, box-shadow .15s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--vinho)}
.btn-lilas{background:var(--lilas);color:var(--vinho)}
.btn-branco{background:#fff;color:var(--vinho)}
.btn-verm{background:var(--verm);color:#fff}

/* ---------- lacunas listradas ---------- */
.lacuna{width:100%;height:100%;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px;text-align:center;background:repeating-linear-gradient(135deg,var(--papel) 0 10px,var(--linha) 10px 20px);border:2px dashed var(--rosa2);border-radius:6px}
.lac-ico{font-size:26px;line-height:1}
.lac-dica{background:var(--papel);color:var(--vinho);font-size:13px;line-height:1.35;padding:6px 10px;border-radius:10px;max-width:28ch}
.lacuna.linha{min-height:0;flex-direction:row;padding:10px;justify-content:flex-start;text-align:left}

/* ---------- menu ---------- */
.topo{position:sticky;top:0;z-index:50;background:var(--rosa)}
.topo::after{content:"";position:absolute;left:0;right:0;top:100%;height:12px;background:radial-gradient(circle at 12px 0,var(--rosa) 11.5px,transparent 12px) 0 0/24px 12px repeat-x;pointer-events:none}
.nav{max-width:1160px;margin:0 auto;padding:0 28px;height:64px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px}
.nav-lado{display:flex;gap:22px}
.nav-lado.dir{justify-content:flex-end}
.nav-lado a,.nav-mobile a{font-size:12.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;text-decoration:none}
.nav-lado a:hover{color:var(--verm)}
.logo{font-family:var(--serifa);font-size:24px;text-decoration:none;white-space:nowrap}
.logo .estrela{color:var(--verm);margin-left:4px;font-size:18px}
.nav-btn{display:none;justify-self:end;background:var(--papel);border:2px solid var(--vinho);border-radius:999px;padding:8px 16px;font:700 13px var(--texto);color:var(--vinho);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.nav-mobile{display:flex;flex-direction:column;gap:4px;padding:6px 16px 16px;background:var(--rosa)}
.nav-mobile[hidden]{display:none}
.nav-mobile a{padding:10px 4px;border-bottom:1px solid var(--rosa2)}

/* ---------- capa ---------- */
.capa{padding:70px 0 80px;position:relative}
.capa-grid{display:grid;grid-template-columns:1.12fr .88fr;gap:48px;align-items:center}
.capa-txt{position:relative}
.sobrelinha{font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px}
.capa-nome{font-size:clamp(46px,6.4vw,84px);line-height:.95;letter-spacing:-.01em}
.capa-nichos{font-family:var(--serifa);font-style:italic;color:var(--verm);font-size:clamp(19px,2vw,24px);margin-top:14px}
.capa-frase{margin-top:14px;max-width:56ch;font-size:15.5px}
.provas{list-style:none;display:flex;flex-wrap:wrap;gap:18px;padding:0;margin:26px 0 0}
.prova{display:flex;flex-direction:column;align-items:center;width:112px;text-align:center}
.prova-selo{position:relative;width:96px;height:96px;display:grid;place-items:center}
.prova-selo svg{position:absolute;inset:0;width:100%;height:100%}
.prova-selo b{position:relative;font-family:var(--serifa);font-weight:500;font-size:25px}
.prova-txt{font-size:13px;font-weight:500;margin-top:6px;line-height:1.3}
.seta-mao{position:absolute;right:-30px;bottom:-6px;width:150px;color:var(--vinho)}
.capa-foto{position:relative;max-width:400px;justify-self:center;width:100%}
.polaroid{position:relative;margin:0;background:#fff;padding:10px 10px 14px;box-shadow:0 12px 26px rgba(122,20,48,.17);transform:rotate(var(--rot,0deg))}
.fita{position:absolute;top:-13px;left:50%;width:86px;height:26px;transform:translateX(-50%) rotate(-4deg);background:rgba(244,143,177,.6);z-index:2}
.polaroid-capa{--rot:2.5deg;padding:14px 14px 18px}
.polaroid-capa .fita.f1{left:14%;transform:rotate(-28deg);background:rgba(210,40,58,.55)}
.polaroid-capa .fita.f2{left:auto;right:-16px;transform:rotate(32deg);background:rgba(244,143,177,.65)}
.foto-box{aspect-ratio:4/5;overflow:hidden;background:var(--linha)}
.foto-box img{width:100%;height:100%;object-fit:cover}
.etiqueta-papel{display:inline-block;margin-top:12px;background:var(--creme);border:1.5px solid var(--vinho);padding:5px 12px;font-size:13px;border-radius:4px;transform:rotate(-1.5deg)}
.bilhete{position:absolute;right:-26px;bottom:62px;background:var(--papel);border:1.5px solid var(--linha);padding:8px 14px;font-family:var(--mao);font-weight:700;font-size:22px;transform:rotate(-6deg);box-shadow:0 6px 14px rgba(122,20,48,.14);z-index:3}
.selo-brilho{position:absolute;left:-74px;top:36%;width:144px;height:144px;z-index:4}
.selo-brilho svg{width:100%;height:100%}
.selo-brilho .gira{transform-origin:50% 50%;transform-box:view-box;animation:girar 30s linear infinite}
.selo-brilho .cereja{position:absolute;inset:0;display:grid;place-items:center;font-size:34px}
@keyframes girar{to{transform:rotate(360deg)}}
.adesivo{position:absolute;font-size:34px;animation:balanco 3.2s ease-in-out infinite;transform-origin:50% 0;z-index:5;filter:drop-shadow(0 3px 2px rgba(122,20,48,.2))}
.adesivo:nth-child(2n){animation-duration:4s;animation-delay:-1s}
@keyframes balanco{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}

/* ---------- sobre ---------- */
.sobre{background:var(--verm);padding:76px 0}
.caderno{position:relative;background-color:var(--creme);border-radius:8px;padding:64px clamp(20px,5vw,56px) 46px;box-shadow:0 16px 34px rgba(0,0,0,.2);
  background-image:radial-gradient(circle,var(--furo,var(--verm)) 7px,transparent 7.5px);background-size:44px 44px;background-repeat:repeat-x;background-position:18px 6px}
.sobre-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:44px;align-items:center}
.sobre-txt p+p{margin-top:12px}
.sobre-txt h2{margin-bottom:18px}
.polaroid-sobre{--rot:-3deg;max-width:300px;justify-self:center;width:100%}
.polaroid-sobre figcaption{font-family:var(--mao);font-weight:700;font-size:21px;text-align:center;margin-top:8px}
.difs{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--vinho);border-radius:14px;overflow:hidden;margin-top:34px}
.dif{padding:20px;border-left:2px solid var(--vinho);background:var(--papel)}
.dif:first-child{background:var(--vinho);color:var(--creme);border-left:0}
.dif b{display:block;font-family:var(--serifa);font-weight:500;font-size:20px;margin-bottom:6px}
.dif span{font-size:15px}
.pilula{display:inline-flex;align-items:center;gap:8px;background:var(--rosa);color:var(--vinho);border:1.5px solid var(--vinho);border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px;margin-top:24px}

/* ---------- faixa de marcas ---------- */
.faixa-marcas{background:var(--vinho);color:var(--rosa);overflow:hidden;padding:14px 0}
.faixa-trilho{display:flex;width:max-content;animation:rolar 40s linear infinite}
.faixa-item{display:flex;align-items:center;gap:30px;padding-right:30px;font-family:var(--serifa);font-size:20px;white-space:nowrap}
.faixa-item img{height:30px;width:auto;filter:brightness(0) invert(1);opacity:.9}
.faixa-item i{font-style:normal;color:var(--rosa2);font-size:15px}
@keyframes rolar{to{transform:translateX(-50%)}}

/* ---------- destaques ---------- */
.destaques{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);min-height:620px}
.destaques>*{min-width:0}
.dest-esq{background:var(--creme);padding:80px clamp(24px,4vw,64px);display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.dest-esq p{margin-top:14px;max-width:38ch}
.dest-dir{background:repeating-linear-gradient(90deg,var(--rosa) 0 30px,var(--papel) 30px 60px);display:flex;align-items:center;justify-content:center;padding:70px 26px}
.dest-trilho{display:flex;align-items:center;justify-content:center;gap:22px;width:100%;max-width:700px}
.dcard{width:29%;flex:none}
.dcard:nth-child(1){order:2;width:36%;--rot:-1.5deg;z-index:2}
.dcard:nth-child(2){order:1;--rot:-4deg}
.dcard:nth-child(3){order:3;--rot:3.5deg}
.dcard figcaption{margin-top:9px;text-align:center}
.dcard .tit{display:block;font-family:var(--mao);font-weight:700;font-size:21px;line-height:1.1}
.dcard .tags{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.dcard .vazio-txt{opacity:.7}
.selo-res{position:absolute;top:-30px;right:-30px;width:96px;height:96px;display:grid;place-items:center;z-index:3;transform:rotate(10deg)}
.selo-res svg{position:absolute;inset:0;width:100%;height:100%}
.selo-res b{position:relative;color:#fff;font-size:13px;line-height:1.15;text-align:center;max-width:70px}

/* ---------- vídeos ---------- */
.vbox{position:relative;aspect-ratio:9/16;overflow:hidden;background:var(--linha);cursor:pointer}
.vbox video{width:100%;height:100%;object-fit:cover}
.vbox.vazio{cursor:default}
.vplay{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;background:var(--papel);color:var(--vinho);display:grid;place-items:center;font-size:15px;box-shadow:0 3px 8px rgba(0,0,0,.2);pointer-events:none}

.xadrez{height:28px;background:repeating-conic-gradient(var(--vinho) 0 25%,var(--rosa) 0 50%) 0 0/28px 28px}

/* ---------- nichos ---------- */
.nichos{background:var(--lilas);padding:80px 0 90px}
.nichos-topo{text-align:center}
.atalhos{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:26px 0 46px}
.atalhos a{border:2px solid var(--vinho);background:var(--papel);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:700;text-decoration:none}
.atalhos a:hover{background:var(--rosa)}
.pag-borda{filter:drop-shadow(4px 5px 0 var(--vinho));scroll-margin-top:90px}
.pag-borda+.pag-borda{margin-top:44px}
.pagina{--r:9px;background:var(--creme);padding:40px clamp(20px,4vw,46px) 34px;
  -webkit-mask:radial-gradient(var(--r) at 50% 50%,#000 98%,#0000) 0 0/calc(2*var(--r)) calc(2*var(--r)) round,linear-gradient(#000 0 0) 50%/calc(100% - 2*var(--r)) calc(100% - 2*var(--r)) no-repeat;
          mask:radial-gradient(var(--r) at 50% 50%,#000 98%,#0000) 0 0/calc(2*var(--r)) calc(2*var(--r)) round,linear-gradient(#000 0 0) 50%/calc(100% - 2*var(--r)) calc(100% - 2*var(--r)) no-repeat}
.pag-topo{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.pag-num{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;background:var(--rosa);border-radius:999px;padding:4px 12px}
.pag-topo h3{font-size:clamp(30px,4vw,44px);margin-top:8px;text-transform:capitalize}
.pag-qtd{font-size:22px;color:var(--verm)}
.setas{display:flex;gap:10px}
.seta-btn{width:46px;height:46px;border-radius:50%;border:0;background:var(--vinho);color:var(--creme);font-size:20px;cursor:pointer;display:grid;place-items:center}
.seta-btn:hover{background:var(--verm)}
.aviso{margin-top:14px;display:inline-block;font-size:13px;background:var(--papel);border:1.5px dashed var(--verm);color:var(--verm);border-radius:8px;padding:6px 12px}
.carrossel{--gap:20px;display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 3*var(--gap))/4);gap:var(--gap);overflow-x:auto;scroll-snap-type:x mandatory;padding:26px 6px 18px;margin-top:8px;scrollbar-width:thin;scrollbar-color:var(--rosa2) transparent;cursor:grab}
.carrossel.arrastando{scroll-snap-type:none;cursor:grabbing;user-select:none}
.ncard{scroll-snap-align:start}
.ncard:nth-child(4n+1){--rot:-2deg}.ncard:nth-child(4n+2){--rot:1.5deg}.ncard:nth-child(4n+3){--rot:-1deg}.ncard:nth-child(4n){--rot:2deg}
.ncard figcaption{font-family:var(--mao);font-weight:700;font-size:19px;text-align:center;margin-top:7px;min-height:1.2em;line-height:1.15}
.ncard .lacuna{aspect-ratio:9/16;height:auto}

/* ---------- o que as marcas falam ---------- */
.feedback{padding:84px 0}
.feedback .topo-sec{text-align:center}
.bilhetes{display:grid;grid-template-columns:repeat(3,1fr);gap:34px;margin-top:44px}
.bilhete-card{position:relative;margin:0;padding:34px 24px 22px;box-shadow:0 10px 22px rgba(122,20,48,.14);transform:rotate(var(--rot))}
.bilhete-card:nth-child(1){background:var(--rosa);--rot:-2deg}
.bilhete-card:nth-child(2){background:var(--lilas);--rot:1.5deg}
.bilhete-card:nth-child(3){background:var(--pessego);--rot:-1deg}
.bilhete-card blockquote{margin:0;font-family:var(--serifa);font-size:19px;line-height:1.35}
.bilhete-card img{width:100%;border-radius:4px}
.bilhete-card figcaption{margin-top:14px}
.bilhete-card .marca{font-family:var(--mao);font-weight:700;font-size:24px;display:block}
.bilhete-card .det{font-size:13px}
.marcas-tit{text-align:center;margin-top:60px;font-size:24px}
.marcas-lista{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:0;margin:18px 0 0}
.marcas-lista li{background:var(--papel);border:2px solid var(--vinho);border-radius:999px;padding:8px 18px;font-family:var(--serifa);font-size:17px}

/* ---------- contato ---------- */
.contato{background:repeating-linear-gradient(90deg,var(--rosa) 0 30px,var(--papel) 30px 60px);padding:80px 0 90px}
.contato .caderno{--furo:var(--rosa);max-width:860px;margin:0 auto;text-align:center}
.chamado{font-size:28px;color:var(--verm);margin-top:10px}
.contato .botoes{justify-content:center}
.orcamento{margin:40px auto 0;max-width:640px;text-align:left;background:var(--papel);border:2px solid var(--vinho);border-radius:16px;padding:24px}
.orcamento h3{font-size:24px;margin-bottom:14px}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.campos label{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:700}
.campos label:last-child{grid-column:1/-1}
.campos input{font:16px var(--texto);color:var(--vinho);background:#fff;border:1.5px solid var(--rosa2);border-radius:10px;padding:11px 12px}
.campos input:focus{border-color:var(--vinho);outline:none;box-shadow:0 0 0 3px var(--rosa)}
.gotcha{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.orcamento .btn{margin-top:16px;width:100%}
.form-msg{margin-top:12px;font-size:15px}
.form-ok{font-family:var(--serifa);font-size:24px;text-align:center;padding:20px 0}
.duvidas-tit{margin-top:48px;font-size:26px}
.duvidas{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--vinho);border-radius:14px;overflow:hidden;margin-top:18px;text-align:left}
.duvida{padding:18px 20px;background:var(--papel)}
.duvida:nth-child(odd){border-right:2px solid var(--vinho)}
.duvida:nth-child(-n+2){border-bottom:2px solid var(--vinho)}
.duvida b{display:block;font-family:var(--serifa);font-weight:500;font-size:18px;margin-bottom:6px}
.duvida span{font-size:15px}

/* ---------- rodapé ---------- */
.rodape{position:relative;background:var(--vinho);color:var(--creme);text-align:center;padding:48px 16px 96px;margin-top:12px}
.rodape::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:12px;background:radial-gradient(circle at 12px 12px,var(--vinho) 11.5px,transparent 12px) 0 0/24px 12px repeat-x}
.rod-nome{font-family:var(--serifa);font-size:28px}
.rodape p+p{margin-top:6px;font-size:14px}
.rodape .mao{color:var(--rosa);font-size:24px}

/* ---------- WhatsApp fixo ---------- */
.wa-fixo{position:fixed;right:16px;bottom:16px;z-index:60;width:52px;height:52px;border-radius:50%;background:var(--verm);color:#fff;display:grid;place-items:center;border:2px solid var(--vinho);box-shadow:3px 3px 0 var(--vinho)}
.wa-fixo svg{width:26px;height:26px}

/* ---------- player ---------- */
.player{position:fixed;inset:0;z-index:100;background:rgba(45,6,18,.86);display:flex;align-items:center;justify-content:center;padding:20px}
.player[hidden]{display:none}
.player-caixa{position:relative;display:flex;flex-direction:column;align-items:center}
.player video{height:min(84vh,calc(92vw*16/9));width:auto;max-width:92vw;aspect-ratio:9/16;background:#000;border-radius:10px}
.player-tit{color:var(--creme);margin-top:10px;font-family:var(--mao);font-size:22px}
.player-x{position:absolute;top:-14px;right:-14px;width:44px;height:44px;border-radius:50%;border:2px solid var(--vinho);background:var(--creme);color:var(--vinho);font-size:24px;cursor:pointer;line-height:1}

/* ---------- responsivo ---------- */
@media (max-width:980px){
  .nav-lado{display:none}
  .nav{grid-template-columns:1fr auto}
  .nav-btn{display:inline-block}
  .destaques{grid-template-columns:minmax(0,1fr)}
  .dest-esq{padding:64px 28px 40px}
  .carrossel{grid-auto-columns:calc((100% - var(--gap))/2)}
}
@media (min-width:981px){ .nav-mobile{display:none!important} }
@media (max-width:860px){
  .capa-grid,.sobre-grid{grid-template-columns:1fr}
  .seta-mao{display:none}
  .capa-foto{max-width:360px}
  .selo-brilho{left:-30px;top:-34px}

}
@media (max-width:520px){

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}

}

</a>

<div class="player" id="player" hidden role="dialog" aria-modal="true" aria-label="Vídeo">

<script>
/* =====================================================================
   MOTOR DA PÁGINA. Você não precisa mexer aqui: troque só o DADOS lá embaixo.
   ===================================================================== */
const reduzMovimento = matchMedia('(prefers-reduced-motion: reduce)').matches;
const temMouse = matchMedia('(hover: hover) and (pointer: fine)').matches;
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = t => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
  .trim().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '').replace(/-+/g, '-');
const primeiroNome = () => (DADOS.nome || '').split(' ')[0];

/* Selo ondulado (flor/carimbo) em SVG */
function florPath(n = 14, r = 41) {
  const cx = 50, cy = 50, pico = 49, cR = 2 * pico - r * Math.cos(Math.PI / n);
  let d = '';
  for (let i = 0; i < n; i++) {
    const a0 = i / n * 2 * Math.PI, a1 = (i + .5) / n * 2 * Math.PI, a2 = (i + 1) / n * 2 * Math.PI;
    const p = a => [(cx + r * Math.cos(a)).toFixed(2), (cy + r * Math.sin(a)).toFixed(2)];
    if (!i) d += 'M' + p(a0);
    d += ' Q' + (cx + cR * Math.cos(a1)).toFixed(2) + ',' + (cy + cR * Math.sin(a1)).toFixed(2) + ' ' + p(a2);
  }
  return d + 'Z';
}
const flor = (cor, n) => `<svg viewBox="0 0 100 100" aria-hidden="true"><path d="${florPath(n)}" fill="${cor}"/></svg>`;

/* Lacuna listrada com ícone e dica */
const lacuna = (ico, dica, cls = '') => `<div class="lacuna ${cls}"><span class="lac-ico" aria-hidden="true">${ico}</span><span class="lac-dica">${esc(dica)}</span></div>`;

/* Foto: se o arquivo não existir, vira lacuna */
function foto(src, alt, ico, dica) {
  if (!src) return lacuna(ico, dica);
  return `<img src="${esc(src)}" alt="${esc(alt)}" data-ico="${ico}" data-dica="${esc(dica)}" onerror="semFoto(this)">`;
}
function semFoto(img) { img.parentElement.innerHTML = lacuna(img.dataset.ico, img.dataset.dica); }

/* Vídeo: miniatura com #t=0.1; se faltar o arquivo, vira lacuna */
const linkExterno = s => /instagram\.com|tiktok\.com|drive\.google|youtu/i.test(s);
function videoBox(src, o = {}) {
  if (!src) return `<div class="vbox vazio">${lacuna('🎬', o.dica)}</div>`;
  if (linkExterno(src)) return `<div class="vbox vazio">${lacuna('⚠️', 'Link de rede social não toca aqui: baixe o .mp4 e coloque na pasta midia')}</div>`;
  const tit = o.titulo || src.split('/').pop().replace(/\.mp4$/i, '');
  const auto = o.auto && !reduzMovimento ? ' autoplay' : '';
  return `<div class="vbox${o.auto ? ' vbox-auto' : ''}" role="button" tabindex="0" aria-label="Assistir: ${esc(tit)}" data-src="${esc(src)}" data-titulo="${esc(tit)}" data-dica="${esc(o.dica)}">
    <video muted loop playsinline${auto} preload="metadata" draggable="false"${o.capa ? ` poster="${esc(o.capa)}"` : ''} src="${esc(src)}#t=0.1" onerror="semVideo(this)"></video>
    <span class="vplay" aria-hidden="true">▶</span></div>`;
}
function semVideo(v) {
  const box = v.closest('.vbox');
  box.className = 'vbox vazio';
  box.removeAttribute('role'); box.removeAttribute('tabindex'); box.removeAttribute('aria-label');
  box.innerHTML = lacuna('🎬', box.dataset.dica);
}

/* Links de contato */
function linkWhats() {
  let n = String(DADOS.whatsapp || '').replace(/\D/g, '');
  if (!n) return `mailto:${DADOS.email}?subject=${encodeURIComponent('Vídeos UGC pra minha marca')}`;
  if (n.length <= 11) n = '55' + n;
  const msg = `Oi, ${primeiroNome()}! Vi seu portfólio e quero conversar sobre vídeos pra minha marca.`;
  return `https://wa.me/${n}?text=${encodeURIComponent(msg)}`;
}
const linkInsta = () => 'https://instagram.com/' + String(DADOS.instagram || '').replace(/^@/, '');
const formOk = () => /^https:\/\/formspree\.io\/f\/\w+/.test(DADOS.formspree || '');

/* ------------------------- MONTAGEM ------------------------- */
function montar() {
  const D = DADOS;
  $('#logoNome').textContent = D.nome;
  const wa = linkWhats();
  $('#waFixo').href = wa;
  if (!D.whatsapp) $('#waFixo').setAttribute('aria-label', 'Mandar e-mail');

  /* 1. CAPA */
  const cores = [['#F9A27C', '#7A1430'], ['#7A1430', '#FDF6EE'], ['#F9C9D6', '#7A1430']];
  $('#inicio').innerHTML = `
  <div class="wrap capa-grid">
    <div class="capa-txt">
      <p class="sobrelinha">(UGC creator · brilho da Rafa Chagas)</p>
      <h1 class="capa-nome">${esc(D.nome)}</h1>
      <p class="capa-nichos">UGC creator de ${esc(D.nichosResumo)}</p>
      <p class="capa-frase">${esc(D.frase)}</p>
      <ul class="provas">${D.provas.map((p, i) => `
        <li class="prova"><span class="prova-selo">${flor(cores[i % 3][0], 12)}<b style="color:${cores[i % 3][1]}">${esc(p.numero)}</b></span><span class="prova-txt">${esc(p.texto)}</span></li>`).join('')}
      </ul>
      <div class="botoes">
        <a class="btn btn-lilas" href="#destaques">Ver meus melhores vídeos</a>
        <a class="btn btn-branco" href="#contato">Falar comigo</a>
      </div>
      <svg class="seta-mao" viewBox="0 0 160 90" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 74c22 12 62 14 92-6 18-12 30-30 40-50"/><path d="M124 22l17-6 3 18"/></svg>
    </div>
    <div class="capa-foto">
      <div class="selo-brilho" role="img" aria-label="Brilho: aluna Rafa Chagas">
        <svg viewBox="0 0 100 100" aria-hidden="true"><g class="gira">
          <path d="${florPath(16, 43)}" fill="#7A1430"/>
          <defs><path id="anelTxt" d="M50,50 m-34,0 a34,34 0 1,1 68,0 a34,34 0 1,1 -68,0"/></defs>
          <text fill="#F9C9D6" font-family="DM Sans, sans-serif" font-weight="700" font-size="9"><textPath href="#anelTxt" textLength="211" lengthAdjust="spacing">BRILHO ♥ ALUNA RAFA CHAGAS ♥</textPath></text>
        </g></svg>
        <span class="cereja" aria-hidden="true">🍒</span>
      </div>
      <figure class="polaroid polaroid-capa">
        <span class="fita f1"></span><span class="fita f2"></span>
        <div class="foto-box">${foto(D.fotoCapa, 'Foto de ' + D.nome, '📷', 'Retrato com rosto, luz natural e ambiente real. Sem selfie: a capa mostra o seu nível · midia/capa.jpg')}</div>
        <figcaption><span class="etiqueta-papel">Vídeos feitos por: <b>${esc(D.nome)}</b></span></figcaption>
      </figure>
      <p class="bilhete">me chama pra brilhar ✦</p>
      <span class="adesivo" style="top:-26px;right:12%" aria-hidden="true">💄</span>
      <span class="adesivo" style="top:28%;right:-38px" aria-hidden="true">✨</span>
      <span class="adesivo" style="bottom:-20px;left:8%" aria-hidden="true">🍒</span>
      <span class="adesivo" style="bottom:22%;left:-50px" aria-hidden="true">⭐</span>
    </div>
  </div>`;

  /* 2. SOBRE MIM */
  const paras = (D.sobreTexto || []).map(p => p ? `<p>${esc(p)}</p>`
    : lacuna('✍️', 'Conte sua rotina e por que as marcas do seu nicho combinam com você (1 ou 2 frases)', 'linha')).join('');
  $('#sobre').innerHTML = `
  <div class="wrap"><div class="caderno">
    <div class="sobre-grid">
      <div class="sobre-txt">
        <span class="etiqueta-rosa">Sobre mim</span>
        <h2>Prazer, eu sou a ${esc(primeiroNome())}</h2>
        ${paras}
        <span class="pilula">✦ Formada no Método Profissão do Futuro · aluna da Rafa Chagas</span>
      </div>
      <figure class="polaroid polaroid-sobre"><span class="fita"></span>
        <div class="foto-box">${foto(D.fotoSobre, D.nome + ' no dia a dia', '☕', 'Você no dia a dia, na sua rotina real, com luz natural · midia/sobre.jpg')}</div>
        <figcaption>eu no dia a dia</figcaption>
      </figure>
    </div>
    <div class="difs">${D.diferenciais.map(d => `<div class="dif"><b>${esc(d.titulo)}</b><span>${esc(d.texto)}</span></div>`).join('')}</div>
  </div></div>`;

  /* Faixa de marcas (rolando devagar) */
  const itens = D.marcas.map(m => `<span class="faixa-item">${m.logo ? `<img src="${esc(m.logo)}" alt="${esc(m.nome)}" onerror="this.replaceWith(document.createTextNode(this.alt))">` : esc(m.nome)}<i aria-hidden="true">✦</i></span>`);
  let fila = []; while (fila.length < 10 && itens.length) fila = fila.concat(itens);
  $('#faixaMarcas').innerHTML = D.marcas.length ? `<div class="faixa-trilho">${fila.join('')}<span aria-hidden="true" style="display:contents">${reduzMovimento ? '' : fila.join('')}</span></div>` : '';
  if (!D.marcas.length) $('#faixaMarcas').remove();

  /* 3. DESTAQUES */
  $('#destaques').innerHTML = `
  <div class="dest-esq">
    <span class="etiqueta-rosa">Destaques</span>
    <h2>Meus melhores vídeos</h2>
    <p>Os três vídeos que mais mostram o meu trabalho. Toque ou clique pra assistir com som.</p>
    <div class="botoes"><a class="btn btn-verm" href="#nichos">Ver conteúdo por nichos</a></div>
  </div>
  <div class="dest-dir"><div class="dest-trilho">${D.destaques.slice(0, 3).map((v, i) => `
    <figure class="polaroid dcard"><span class="fita"></span>
      ${v.res ? `<span class="selo-res">${flor('#D2283A', 14)}<b>${esc(v.res)}</b></span>` : ''}
      ${videoBox(v.video, { auto: i === 0, capa: v.capa, titulo: v.titulo, dica: `Os melhores na frente, não os mais recentes · midia/destaques/${i + 1}.mp4` })}
      <figcaption>
        <span class="tit${v.titulo ? '' : ' vazio-txt'}">${esc(v.titulo || 'título curto do vídeo')}</span>
        <span class="tags${v.nicho ? '' : ' vazio-txt'}">${esc(v.nicho || 'nicho')} · ${esc(v.formato || 'formato')}</span>
      </figcaption>
    </figure>`).join('')}
  </div></div>`;

  /* 4. NICHOS (uma página por nicho, com carrossel) */
  $('#nichos').innerHTML = `
  <div class="wrap">
    <div class="nichos-topo">
      <span class="etiqueta-rosa">Conteúdo por nichos</span>
      <h2>Ache o vídeo do seu nicho</h2>
      <nav class="atalhos" aria-label="Atalhos dos nichos">${D.nichos.map(n => `<a href="#nicho-${slug(n.nome)}">${esc(n.nome)}</a>`).join('')}</nav>
    </div>
    ${D.nichos.map((n, i) => {
      const vids = (n.videos || []).map(v => typeof v === 'string' ? { video: v } : v);
      const pasta = `midia/nichos/${n.nome}/`;
      let cards = vids.map(v => `<figure class="polaroid ncard"><span class="fita"></span>${videoBox(v.video, { titulo: v.titulo, capa: v.capa, dica: 'Vídeo não encontrado: confira o nome em ' + pasta })}<figcaption>${esc(v.titulo || '')}</figcaption></figure>`);
      if (vids.length < 3) for (let k = vids.length; k < 4; k++)
        cards.push(`<figure class="polaroid ncard"><span class="fita"></span>${lacuna('🎬', `Coloque o .mp4 em ${pasta} e escreva o nome no DADOS`)}<figcaption></figcaption></figure>`);
      return `
      <div class="pag-borda" id="nicho-${slug(n.nome)}"><article class="pagina">
        <header class="pag-topo">
          <div>
            <span class="pag-num">página ${String(i + 1).padStart(2, '0')}</span>
            <h3>${esc(n.nome)}</h3>
            <span class="mao pag-qtd">${vids.length} ${vids.length === 1 ? 'vídeo' : 'vídeos'}</span>
          </div>
          <div class="setas">
            <button class="seta-btn" type="button" data-dir="-1" aria-label="Vídeos anteriores de ${esc(n.nome)}">←</button>
            <button class="seta-btn" type="button" data-dir="1" aria-label="Próximos vídeos de ${esc(n.nome)}">→</button>
          </div>
        </header>
        ${vids.length < 3 ? '<p class="aviso">mínimo 3 vídeos: com menos, tire o nicho</p>' : ''}
        <div class="carrossel">${cards.join('')}</div>
      </article></div>`;
    }).join('')}
  </div>`;

  /* 5. O QUE AS MARCAS FALAM */
  $('#feedback').innerHTML = `
  <div class="wrap">
    <div class="topo-sec"><span class="etiqueta-rosa">Feedback</span><h2>O que as marcas falam</h2></div>
    <div class="bilhetes">${D.elogios.slice(0, 3).map(e => (e.texto || e.print) ? `
      <figure class="bilhete-card"><span class="fita"></span>
        ${e.print ? `<img src="${esc(e.print)}" alt="Print do elogio de ${esc(e.marca)}">` : `<blockquote>“${esc(e.texto)}”</blockquote>`}
        <figcaption><span class="marca">${esc(e.marca)}</span><span class="det">${esc(e.detalhe)}</span></figcaption>
      </figure>` : `
      <figure class="bilhete-card"><span class="fita"></span>${lacuna('💬', 'cole aqui a frase ou o print real da marca')}</figure>`).join('')}
    </div>
    <h3 class="marcas-tit">Marcas que já atendi</h3>
    <ul class="marcas-lista">${D.marcas.map(m => `<li>${esc(m.nome)}</li>`).join('')}</ul>
  </div>`;

  /* 6. CONTATO */
  const form = formOk() ? `
    <form class="orcamento" id="orcamento">
      <h3>Pedir orçamento</h3>
      <div class="campos">
        <label>Seu nome<input name="nome" required autocomplete="name"></label>
        <label>Empresa<input name="empresa" required autocomplete="organization"></label>
        <label>Produto<input name="produto" required></label>
        <label>Prazo<input name="prazo" required placeholder="ex.: até dia 20"></label>
        <label>WhatsApp<input name="whatsapp" type="tel" required autocomplete="tel" inputmode="tel"></label>
      </div>
      <input class="gotcha" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="btn btn-verm" type="submit">Pedir orçamento</button>
      <p class="form-msg" role="status"></p>
    </form>` : '';
  $('#contato').innerHTML = `
  <div class="wrap"><div class="caderno">
    <span class="etiqueta-rosa">Contato</span>
    <h2>Seu produto merece um vídeo que brilha ✦</h2>
    <p class="chamado mao">bora trabalhar juntos?</p>
    <div class="botoes">
      <a class="btn btn-verm" href="${esc(wa)}" target="_blank" rel="noopener">${D.whatsapp ? '💬 Chamar no WhatsApp' : '✉️ Mandar e-mail'}</a>
      <a class="btn btn-branco" href="${esc(linkInsta())}" target="_blank" rel="noopener">Instagram ${esc(D.instagram)}</a>
    </div>
    ${form}
    <h3 class="duvidas-tit">Dúvidas rápidas</h3>
    <div class="duvidas">${D.duvidas.slice(0, 4).map(d => `<div class="duvida"><b>${esc(d.pergunta)}</b>${d.resposta ? `<span>${esc(d.resposta)}</span>` : lacuna('✏️', d.dica || 'escreva a resposta aqui', 'linha')}</div>`).join('')}</div>
  </div></div>`;

  $('#rodape').innerHTML = `<p class="rod-nome">${esc(D.nome)}</p><p>UGC creator · aluna da Rafa Chagas</p><p class="mao">feito com brilho ✦</p>`;

  ligarInteracoes();
  if (D.umami) { // métricas: só cria o script se tiver ID
    const s = document.createElement('script');
    s.src = 'https://cloud.umami.is/script.js'; s.defer = true;
    s.setAttribute('data-website-id', D.umami);
    document.head.appendChild(s);
  }
  const c = new URLSearchParams(location.search).get('c'); // link ?c=nicho
  if (c) { const alvo = document.getElementById('nicho-' + slug(c));
    if (alvo) {
      const pular = () => { const y = alvo.getBoundingClientRect().top + scrollY - 90; window.scrollTo({ top: y, behavior: 'instant' }); };
      pular(); window.addEventListener('load', pular, { once: true });
      if (document.fonts) document.fonts.ready.then(pular);
    } }
}

/* ------------------------- INTERAÇÕES ------------------------- */
function ligarInteracoes() {
  /* menu do celular */
  const bt = $('.nav-btn'), nm = $('#navMobile');
  bt.addEventListener('click', () => { const abre = nm.hidden; nm.hidden = !abre; bt.setAttribute('aria-expanded', abre); bt.textContent = abre ? 'fechar' : 'menu'; });
  nm.addEventListener('click', e => { if (e.target.closest('a')) { nm.hidden = true; bt.setAttribute('aria-expanded', false); bt.textContent = 'menu'; } });

  /* 1º destaque: toca sozinho, sem som, quando aparece */
  const auto = $('.vbox-auto video');
  if (auto && !reduzMovimento && 'IntersectionObserver' in window) {
    new IntersectionObserver(([e]) => { e.isIntersecting ? auto.play().catch(() => {}) : auto.pause(); }, { threshold: .35 }).observe(auto);
  }
  /* os outros: no computador tocam sem som ao passar o mouse */
  if (temMouse) document.querySelectorAll('.vbox:not(.vbox-auto)').forEach(b => {
    b.addEventListener('mouseenter', () => { const v = b.querySelector('video'); if (v) { v.muted = true; v.play().catch(() => {}); } });
    b.addEventListener('mouseleave', () => { const v = b.querySelector('video'); if (v) { v.pause(); v.currentTime = .1; } });
  });

  /* clique/toque abre o player */
  document.addEventListener('click', e => {
    const b = e.target.closest('.vbox');
    if (!b || b.classList.contains('vazio')) return;
    const tr = b.closest('.carrossel'); if (tr && tr.dataset.arrastou) return;
    abrirPlayer(b);
  });
  document.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList?.contains('vbox') && !e.target.classList.contains('vazio')) { e.preventDefault(); abrirPlayer(e.target); }
    if (e.key === 'Escape' && !$('#player').hidden) fecharPlayer();
  });
  $('#player').addEventListener('click', e => { if (e.target.id === 'player' || e.target.closest('.player-x')) fecharPlayer(); });

  /* carrosséis dos nichos: setas + arrastar com o mouse */
  document.querySelectorAll('.seta-btn').forEach(s => s.addEventListener('click', () => {
    const tr = s.closest('.pagina').querySelector('.carrossel');
    tr.scrollBy({ left: Number(s.dataset.dir) * tr.clientWidth, behavior: reduzMovimento ? 'auto' : 'smooth' });
  }));
  document.querySelectorAll('.carrossel').forEach(tr => {
    let ativo = false, arrastou = false, x0 = 0, s0 = 0;
    tr.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') return; ativo = true; arrastou = false; x0 = e.clientX; s0 = tr.scrollLeft; });
    tr.addEventListener('pointermove', e => {
      if (!ativo) return; const dx = e.clientX - x0;
      if (Math.abs(dx) > 6) { if (!arrastou) { arrastou = true; tr.classList.add('arrastando'); } tr.scrollLeft = s0 - dx; }
    });
    const fim = () => { if (!ativo) return; ativo = false; tr.classList.remove('arrastando');
      if (arrastou) { tr.dataset.arrastou = '1'; setTimeout(() => delete tr.dataset.arrastou, 60); } };
    tr.addEventListener('pointerup', fim); tr.addEventListener('pointerleave', fim);
  });

  /* formulário (Formspree) */
  const f = $('#orcamento');
  if (f) f.addEventListener('submit', async e => {
    e.preventDefault();
    const msg = f.querySelector('.form-msg'), btn = f.querySelector('button');
    btn.disabled = true; msg.textContent = 'Enviando…';
    try {
      const r = await fetch(DADOS.formspree, { method: 'POST', headers: { Accept: 'application/json' }, body: new FormData(f) });
      if (!r.ok) throw new Error();
      f.innerHTML = '<p class="form-ok">Recebi! Te chamo em breve.</p>';
    } catch {
      btn.disabled = false;
      msg.innerHTML = `Não consegui enviar agora. Me chama direto: <a class="btn btn-verm" style="margin-top:10px;width:100%" href="${esc(linkWhats())}" target="_blank" rel="noopener">💬 Chamar no WhatsApp</a>`;
    }
  });
}

let ultimoFoco = null;
function abrirPlayer(box) {
  const p = $('#player'), v = p.querySelector('video');
  document.querySelectorAll('.vbox video').forEach(x => x.pause());
  ultimoFoco = box;
  v.src = box.dataset.src; v.muted = false;
  p.querySelector('.player-tit').textContent = box.dataset.titulo;
  p.hidden = false; document.body.style.overflow = 'hidden';
  v.play().catch(() => {});
  p.querySelector('.player-x').focus();
  if (window.umami && typeof window.umami.track === 'function') { // métrica: vídeo mais visto
    try { window.umami.track(slug('video-' + box.dataset.titulo).slice(0, 50)); } catch (e) {}
  }
}
function fecharPlayer() {
  const p = $('#player'), v = p.querySelector('video');
  v.pause(); v.removeAttribute('src'); v.load();
  p.hidden = true; document.body.style.overflow = '';
  if (ultimoFoco) ultimoFoco.focus();
  const auto = $('.vbox-auto video'); if (auto && !reduzMovimento) auto.play().catch(() => {});
}
